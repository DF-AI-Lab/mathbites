<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Bites mock</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6FB; --grid:#DDE5F2; --card:#FFFFFF; --ink:#1B2440; --soft:#5B6584;
  --line:#CBD5E6; --blue:#2F5BEA; --blue-d:#1E3FB0; --gold:#FFB627; --gold-d:#C98500;
  --good:#1C8F5A; --good-bg:#DDF5E8; --sel:#E5ECFF;
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
  --hand:"Caveat", cursive;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  display:flex;flex-direction:column}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.icon{width:36px;height:36px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800}
.bar{flex:1;height:10px;border-radius:99px;background:var(--grid);overflow:hidden}
.bar i{display:block;width:40%;height:100%;background:var(--gold)}
.count{font-family:var(--display);font-weight:800;color:var(--soft)}

/* split layout */
.split{flex:1;display:grid;grid-template-columns:1fr;min-height:0}
@media (min-width:700px){ .split{grid-template-columns:minmax(320px,40%) 1fr} }
@media (min-width:1200px){ .split{grid-template-columns:420px 1fr;max-width:1400px;margin:0 auto;width:100%} }

.left{padding:18px 16px;display:flex;flex-direction:column;gap:14px;overflow:auto}
@media (min-width:700px){ .left{border-right:1px solid var(--line)} }
.tag{align-self:flex-start;font-size:13px;font-weight:700;color:var(--blue-d);background:var(--sel);padding:3px 10px;border-radius:99px}
.q{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.25;margin:0}
.ans{display:flex;gap:10px}
.ans input{flex:1;min-width:0;font:inherit;font-size:20px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
.btn{border:0;border-radius:14px;padding:12px 20px;font-family:var(--display);font-weight:800;font-size:18px;cursor:pointer}
.btn.check{background:var(--blue);color:#fff}
.btn.how{background:transparent;border:2px dashed var(--gold-d);color:var(--gold-d);width:100%}
.steps{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.steps b{font-family:var(--display)}
.step{display:flex;gap:10px;align-items:flex-start}
.step span{flex:none;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-size:13px;font-weight:700}
.step.locked{color:var(--soft);opacity:.6}
.step.locked span{background:var(--grid)}
.next{align-self:flex-start;background:var(--sel);color:var(--blue-d);font-size:15px;padding:8px 14px}

.right{display:flex;flex-direction:column;min-height:0;padding:12px 16px 16px;gap:10px}
.tabs{display:flex;gap:6px}
.tabs button{font:inherit;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--soft);padding:8px 14px;border-radius:12px}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pad{flex:1;min-height:360px;border-radius:16px;border:1px solid var(--line);
  background-color:var(--card);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px;position:relative}
.sum{position:absolute;top:44px;left:176px;font-family:var(--hand);font-size:36px;line-height:44px;color:var(--ink)}
.sum div{display:flex}
.sum div i{width:44px;text-align:center;font-style:normal}
.sum .ul{border-top:3px double var(--ink);border-bottom:3px double var(--ink)}
.sum .carry{font-size:20px;line-height:20px;color:var(--blue)}
.padtools{display:flex;gap:8px;justify-content:space-between}
.padtools .btn{font-size:15px;padding:8px 14px;background:var(--sel);color:var(--blue-d)}
.padtools .use{background:var(--good-bg);color:var(--good)}
.note{position:fixed;right:12px;bottom:10px;font-size:12px;color:var(--soft)}
</style>
</head>
<body>
<header class="top">
  <div class="icon">=</div>
  <div class="bar"><i></i></div>
  <div class="count">2 / 5</div>
</header>

<main class="split">
  <section class="left">
    <div class="tag">Money · no calculator</div>
    <h1 class="q">A shop sells a coat for £148 and a scarf for £37. How much for both?</h1>
    <div class="ans">
      <input value="185" aria-label="Answer">
      <button class="btn check">Check</button>
    </div>
    <button class="btn how">💡 Show me how</button>
    <div class="steps">
      <b>Step by step</b>
      <div class="step"><span>1</span><div>"How much for both" means <b>add</b> them.</div></div>
      <div class="step"><span>2</span><div>Line up the units: 148 on top, 37 underneath.</div></div>
      <div class="step locked"><span>3</span><div>Add the units column first…</div></div>
      <button class="btn next">Next step →</button>
    </div>
  </section>

  <section class="right">
    <div class="tabs">
      <button class="on">Squares</button><button>Scribble</button><button>Jotter</button><button>Calc</button>
    </div>
    <div class="pad">
      <div class="sum">
        <div><i></i><i>1</i><i>4</i><i>8</i></div>
        <div><i>+</i><i></i><i>3</i><i>7</i></div>
        <div class="ul"><i></i><i>1</i><i>8</i><i>5</i></div>
        <div class="carry"><i></i><i></i><i>1</i><i></i></div>
      </div>
    </div>
    <div class="padtools">
      <div style="display:flex;gap:8px"><button class="btn">Carry</button><button class="btn">Clear</button></div>
      <button class="btn use">Use answer ↑</button>
    </div>
  </section>
</main>
</body>
</html>
